[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "panos-toolbox"
version = "0.1.0"
description = "Scripts for Palo Alto Networks firewalls and Strata Cloud Manager"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = []

[project.optional-dependencies]
firewall = ["pan-os-python"]
scm = ["pan-scm-sdk"]
all = ["pan-os-python", "pan-scm-sdk"]
dev = ["pytest", "ruff"]

[project.scripts]
panos-toolbox = "panos_toolbox.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
